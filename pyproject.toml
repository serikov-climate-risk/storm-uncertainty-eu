[project]
name = "storm-uncertainty-eu"
version = "0.1.0"
description = "Windstorm and compound wind-rain uncertainty over Western Europe: non-stationary extremes, clustering, a stochastic event set and importance resampling of loss models"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pandas>=2.2", "scipy>=1.13", "statsmodels>=0.14", "geopandas>=1.0", "shapely>=2.0", "pyarrow>=15", "requests>=2.31", "matplotlib>=3.9"]

[project.optional-dependencies]
test = ["pytest>=8"]
cmip6 = ["xarray", "zarr", "gcsfs", "netCDF4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
